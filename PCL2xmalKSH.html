        function cleanupDrag(ghost) {
            if (ghost) ghost.remove();
            if (draggedItem && dragSourceType === 'right') { draggedItem.style.zIndex = ''; draggedItem.style.opacity = '1'; }
            isDragging = false;
            draggedItem = null;
            dragSourceType = null;
        }

        function applyModuleColors(div) {
            div.style.setProperty('--mod-bg', div.dataset.bgColor || DEFAULT_BG);
            div.style.setProperty('--mod-fg', div.dataset.textColor || DEFAULT_FG);
        }

        function createPlacedModule(type, xamlTemplate, displayText, sourceUrl = '') {
            const decodedXaml = decodeHtmlEntities(xamlTemplate);
            const div = document.createElement('div');
            div.className = 'placed-module';
            div.dataset.type = type;
            div.dataset.xaml = xamlTemplate;
            div.dataset.text = displayText;
            if (sourceUrl) div.dataset.source = sourceUrl;
            div.dataset.bgColor = DEFAULT_BG;
            div.dataset.textColor = DEFAULT_FG;
            if (!div.dataset.uid) div.dataset.uid = genUid();
            applyModuleColors(div);

            if (type === 'Note') {
                const note = document.createElement('div');
                note.className = 'pcl-note';
                note.innerText = displayText;
                div.appendChild(note);
                initPlacedModule(div);
                return div;
            }

            const evTM = decodedXaml.match(/EventType="([^"]*)"/);
            const evDM = decodedXaml.match(/EventData="([^"]*)"/);
            const tipM = decodedXaml.match(/ToolTip="([^"]*)"/);
            if (evTM) div.dataset.eventType = evTM[1];
            if (evDM) div.dataset.eventData = evDM[1];
            if (tipM) div.dataset.tooltip = tipM[1];

            if (div.dataset.eventType === '弹出窗口' && div.dataset.eventData) {
                const parts = div.dataset.eventData.split('|');
                div.dataset.windowTitle = parts[0] || '提示';
                div.dataset.windowContent = parts.slice(1).join('|') || '';
                div.dataset.windowButtonText = '确定';
            }

            const textMatch = decodedXaml.match(/Text="([^"]*)"/) || decodedXaml.match(/Title="([^"]*)"/);
            const visualText = textMatch ? textMatch[1] : displayText;

            if (type === 'MyCard') {
                const card = document.createElement('div');
                card.className = 'pcl-card';
                const header = document.createElement('div');
                header.className = 'pcl-card-header';
                const titleSpan = document.createElement('span');
                titleSpan.innerText = visualText || '新卡片';
                header.appendChild(titleSpan);
                const swapBtn = document.createElement('span');
                swapBtn.className = 'swap-btn';
                swapBtn.innerText = '▲';
                header.appendChild(swapBtn);
                const body = document.createElement('div');
                body.className = 'pcl-card-body';
                const dz = document.createElement('div');
                dz.className = 'container-dropzone';
                body.appendChild(dz);
                card.appendChild(header); card.appendChild(body);
                swapBtn.onclick = (ev) => {
                    ev.stopPropagation();
                    body.classList.toggle('collapsed');
                    swapBtn.innerText = body.classList.contains('collapsed') ? '▼' : '▲';
                    setTimeout(redrawConnections, 0);
                };
                div.appendChild(card);
            } else if (type === 'StackPanel' || type === 'StackPanelV') {
                const sp = document.createElement('div');
                sp.className = 'pcl-stackpanel ' + (type === 'StackPanel' ? 'horizontal' : 'vertical');
                const dz = document.createElement('div');
                dz.className = 'container-dropzone';
                dz.style.flex = '1';
                if (type === 'StackPanel') dz.style.flexDirection = 'row';
                sp.appendChild(dz);
                div.appendChild(sp);
            } else if (type === 'MyButton') {
                const btn = document.createElement('div');
                const colorMatch = decodedXaml.match(/ColorType="([^"]*)"/);
                let colorClass = 'highlight';
                if (colorMatch) {
                    if (colorMatch[1] === 'Red') colorClass = 'red';
                    else if (colorMatch[1] === 'Highlight') colorClass = 'highlight';
                }
                if (!colorMatch) colorClass = '';
                btn.className = 'pcl-button' + (colorClass ? ' ' + colorClass : '');
                btn.innerText = visualText;
                div.appendChild(btn);
                if (div.dataset.eventType) {
                    const tag = document.createElement('div');
                    tag.className = 'event-info-tag';
                    let txt;
                    if (div.dataset.eventType === '弹出窗口' && div.dataset.windowTitle) txt = `弹窗: ${div.dataset.windowTitle}`;
                    else txt = `${div.dataset.eventType}: ${div.dataset.eventData || '无'}`;
                    if (div.dataset.tooltip) txt += '  ⓘ';
                    tag.innerText = txt;
                    div.appendChild(tag);
                }
            } else if (type === 'MyHint') {
                const hint = document.createElement('div');
                const tm = decodedXaml.match(/Theme="([^"]*)"/);
                hint.className = 'pcl-hint ' + (tm ? tm[1].toLowerCase() : 'blue');
                hint.innerText = visualText;
                div.appendChild(hint);
            } else if (type === 'MyListItem') {
                const item = document.createElement('div');
                item.className = 'pcl-listitem';
                const logo = document.createElement('div');
                logo.className = 'item-logo';
                const lm = decodedXaml.match(/Logo="([^"]*)"/);
                if (lm && lm[1]) {
                    if (lm[1].startsWith('pack://')) logo.innerText = 'IMG';
                    else logo.style.backgroundImage = `url('${lm[1]}')`;
                } else logo.innerText = 'L';
                item.appendChild(logo);
                const info = document.createElement('div');
                info.className = 'item-info';
                const title = document.createElement('div');
                title.className = 'item-title';
                title.innerText = visualText;
                info.appendChild(title);
                const im = decodedXaml.match(/Info="([^"]*)"/);
                if (im && im[1]) {
                    const sub = document.createElement('div');
                    sub.className = 'item-subtitle';
                    sub.innerText = im[1];
                    info.appendChild(sub);
                }
                item.appendChild(info);
                div.appendChild(item);
                if (div.dataset.eventType) {
                    const tag = document.createElement('div');
                    tag.className = 'event-info-tag';
                    let txt;
                    if (div.dataset.eventType === '弹出窗口' && div.dataset.windowTitle) txt = `弹窗: ${div.dataset.windowTitle}`;
                    else txt = `${div.dataset.eventType}: ${div.dataset.eventData || '无'}`;
                    if (div.dataset.tooltip) txt += '  ⓘ';
                    tag.innerText = txt;
                    div.appendChild(tag);
                }
            } else if (type === 'MyImage') {
                const sm = decodedXaml.match(/Source="([^"]*)"/);
                const imgUrl = sourceUrl || (sm ? sm[1] : 'https://www.baidu.com/img/flexible/logo/pc/result.png');
                div.dataset.customImgData = imgUrl;
                const img = document.createElement('img');
                img.className = 'pcl-image';
                img.src = imgUrl;
                img.onerror = () => { img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23E8E8E8"/><text x="50" y="50" font-family="sans-serif" font-size="10" fill="%23888" text-anchor="middle" dominant-baseline="middle">加载失败</text></svg>'; };
                div.appendChild(img);
            } else {
                const tb = document.createElement('div');
                tb.className = 'pcl-textblock';
                tb.innerText = visualText;
                div.appendChild(tb);
            }
            initPlacedModule(div);
            return div;
        }

        function selectModule(m) {
            document.querySelectorAll('.placed-module').forEach(x => x.classList.remove('selected'));
            m.classList.add('selected');
            selectedModule = m;
        }

        function showContextMenu(module, x, y) {
            selectedModule = module;
            contextMenu.style.display = 'block';
            if (module.dataset.type === 'MyImage') { btnUploadModuleImg.style.display = 'block'; btnEditEvent.style.display = 'none'; btnEditNote.style.display = 'none'; }
            else if (module.dataset.type === 'MyButton' || module.dataset.type === 'MyListItem') { btnUploadModuleImg.style.display = 'none'; btnEditEvent.style.display = 'block'; btnEditNote.style.display = 'none'; }
            else if (module.dataset.type === 'Note') { btnUploadModuleImg.style.display = 'none'; btnEditEvent.style.display = 'none'; btnEditNote.style.display = 'block'; }
            else { btnUploadModuleImg.style.display = 'none'; btnEditEvent.style.display = 'none'; btnEditNote.style.display = 'none'; }

            const bgOk = supportsBackground(module.dataset.type);
            const fgOk = supportsForeground(module.dataset.type);
            colorPickerBg.disabled = !bgOk;
            colorPickerText.disabled = !fgOk;
            colorPickerBg.parentElement.style.opacity = bgOk ? '1' : '0.4';
            colorPickerText.parentElement.style.opacity = fgOk ? '1' : '0.4';

            const r = contextMenu.getBoundingClientRect();
            let mx = x, my = y;
            if (mx + r.width > window.innerWidth) mx = window.innerWidth - r.width - 10;
            if (my + r.height > window.innerHeight) my = window.innerHeight - r.height - 10;
            if (mx < 5) mx = 5;
            if (my < 5) my = 5;
            contextMenu.style.left = mx + 'px'; contextMenu.style.top = my + 'px';
            colorPickerBg.value = module.dataset.bgColor || DEFAULT_BG;
            colorPickerText.value = module.dataset.textColor || DEFAULT_FG;
        }

        workspace.addEventListener('mousedown', (e) => {
            if (isPreviewMode()) return;
            if (e.target === workspace || e.target === moduleContainer || e.target === svgLayer || e.target.classList.contains('container-dropzone')) {
                document.querySelectorAll('.placed-module').forEach(m => m.classList.remove('selected'));
                selectedModule = null;
                contextMenu.style.display = 'none';
            }
        });
        workspace.addEventListener('touchstart', (e) => {
            if (isPreviewMode()) return;
            if (e.target === workspace || e.target === moduleContainer || e.target === svgLayer || e.target.classList.contains('container-dropzone')) {
                document.querySelectorAll('.placed-module').forEach(m => m.classList.remove('selected'));
                selectedModule = null;
                contextMenu.style.display = 'none';
            }
        }, { passive: true });

        document.addEventListener('mousedown', (e) => {
            if (!contextMenu.contains(e.target) && !e.target.closest('.placed-module') &&
                !eventModal.contains(e.target) && !noteModal.contains(e.target) && !aboutModal.contains(e.target) && !pclDialogOverlay.contains(e.target)) {
                contextMenu.style.display = 'none';
            }
        });

        colorPickerBg.addEventListener('input', (e) => { if (selectedModule) { selectedModule.dataset.bgColor = e.target.value.toUpperCase(); applyModuleColors(selectedModule); } });
        colorPickerText.addEventListener('input', (e) => { if (selectedModule) { selectedModule.dataset.textColor = e.target.value.toUpperCase(); applyModuleColors(selectedModule); } });
        btnResetBg.addEventListener('click', () => { if (selectedModule) { selectedModule.dataset.bgColor = DEFAULT_BG; colorPickerBg.value = DEFAULT_BG; applyModuleColors(selectedModule); } });
        btnResetFg.addEventListener('click', () => { if (selectedModule) { selectedModule.dataset.textColor = DEFAULT_FG; colorPickerText.value = DEFAULT_FG; applyModuleColors(selectedModule); } });
        btnDeleteModule.addEventListener('click', () => {
            if (selectedModule) {
                const uid = selectedModule.dataset.uid;
                selectedModule.remove();
                document.querySelectorAll(`.placed-module[data-type="Note"][data-attached-uid="${uid}"]`).forEach(n => n.remove());
                selectedModule = null;
                contextMenu.style.display = 'none';
                setTimeout(redrawConnections, 0);
            }
        });
        btnUploadModuleImg.addEventListener('click', () => { contextMenu.style.display = 'none'; moduleImgUpload.click(); });
        moduleImgUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && selectedModule && selectedModule.dataset.type === 'MyImage') {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = selectedModule.querySelector('.pcl-image');
                    if (img) img.src = ev.target.result;
                    selectedModule.dataset.customImgData = ev.target.result;
                    moduleImgUpload.value = '';
                };
                reader.readAsDataURL(file);
            }
        });

        function getChildModules(node) {
            if (node.dataset.type === 'MyCard' || node.dataset.type === 'StackPanel' || node.dataset.type === 'StackPanelV') {
                const dz = node.querySelector('.container-dropzone');
                if (dz) return Array.from(dz.children).filter(c => c.classList.contains('placed-module'))
                    .sort((a, b) => (parseInt(a.dataset.order) || 0) - (parseInt(b.dataset.order) || 0));
            }
            return [];
        }

        function generateXaml(node) {
            if (node.nodeType !== 1) return '';
            if (node.dataset.type === 'Note') return `<!-- ${escapeNote(node.dataset.text || '')} -->`;

            const children = getChildModules(node);
            let childXaml = '';
            children.forEach(c => { childXaml += generateXaml(c) + '\n'; });

            let tpl = node.dataset.xaml || '';

            let finalText = node.dataset.text || '';
            const te = node.querySelector('.pcl-textblock') ||
                       node.querySelector('.pcl-button') ||
                       node.querySelector('.pcl-listitem .item-title') ||
                       node.querySelector('.pcl-card-header > span:first-child') ||
                       node.querySelector('.pcl-hint');
            if (te && te.innerText) finalText = te.innerText;
            finalText = escapeXaml(finalText);

            if (tpl.includes('%%TEXT%%')) tpl = safeReplace(tpl, /%%TEXT%%/g, finalText);
            if (tpl.includes('%%CONTENT%%')) {
                tpl = safeReplace(tpl, /%%CONTENT%%/g, childXaml.trim());
                tpl = tpl.replace(/>\s+</g, '><');
            }
            if (node.dataset.type === 'MyImage' && node.dataset.customImgData) {
                tpl = safeReplace(tpl, /Source="[^"]*"/, `Source="${node.dataset.customImgData}"`);
            }
            if (node.dataset.eventType) {
                tpl = safeReplace(tpl, /EventType="[^"]*"/, `EventType="${escapeXaml(node.dataset.eventType)}"`);
            }
            if (node.dataset.eventType === '弹出窗口') {
                const ed = (node.dataset.windowTitle || '提示') + '|' + (node.dataset.windowContent || '');
                tpl = safeReplace(tpl, /EventData="[^"]*"/, `EventData="${escapeXaml(ed)}"`);
            } else if (node.dataset.eventData) {
                tpl = safeReplace(tpl, /EventData="[^"]*"/, `EventData="${escapeXaml(node.dataset.eventData)}"`);
            }
            if (node.dataset.tooltip) {
                if (/ToolTip="[^"]*"/.test(tpl)) {
                    tpl = safeReplace(tpl, /ToolTip="[^"]*"/, `ToolTip="${escapeXaml(node.dataset.tooltip)}"`);
                } else {
                    tpl = tpl.replace(/<([a-zA-Z][a-zA-Z0-9:]*)(\s|\/|>)/, (m, tag, sep) => `<${tag} ToolTip="${escapeXaml(node.dataset.tooltip)}"${sep}`);
                }
            }
            if (!node.dataset.xaml.includes('%%TEXT%%')) {
                if (node.dataset.type === 'MyButton' || node.dataset.type === 'TextBlock' || node.dataset.type === 'MyHint') {
                    tpl = safeReplace(tpl, /Text="[^"]*"/, `Text="${finalText}"`);
                } else if (node.dataset.type === 'MyListItem' || node.dataset.type === 'MyCard') {
                    tpl = safeReplace(tpl, /Title="[^"]*"/, `Title="${finalText}"`);
                }
            }

            tpl = tpl.replace(/\s+Background="[^"]*"/g, '').replace(/\s+Foreground="[^"]*"/g, '');
            const bg = node.dataset.bgColor || DEFAULT_BG;
            const fg = node.dataset.textColor || DEFAULT_FG;
            if (supportsBackground(node.dataset.type)) {
                tpl = tpl.replace(/<([a-zA-Z][a-zA-Z0-9:]*)(\s|\/|>)/, (m, tag, sep) => `<${tag} Background="${bg}"${sep}`);
            }
            if (supportsForeground(node.dataset.type)) {
                tpl = tpl.replace(/<([a-zA-Z][a-zA-Z0-9:]*)(\s|\/|>)/, (m, tag, sep) => `<${tag} Foreground="${fg}"${sep}`);
            }
            return tpl;
        }

        function generateFullXaml() {
            const tops = getOrderedSiblings(moduleContainer);
            let out = '';
            tops.forEach(m => { out += generateXaml(m) + '\n\n'; });
            let final = out.trim();
            if (final) {
                final = final.replace(/&(?!(amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/g, '&amp;');
                final = `<!-- 这是 PCL 的主页自定义文件。你可以通过修改这个文件来自定义 PCL 主页：添加文本、打开网页、启动游戏，等等。\n     如果你倒腾这个文件把 PCL 玩炸了，把这个文件直接删除就行了。 -->\n\n` + final;
            }
            return final;
        }

        document.getElementById('btn-arrange').addEventListener('click', autoArrange);

        document.getElementById('btn-preset').addEventListener('click', () => {
            if (moduleContainer.children.length > 0) { if (!confirm("加载预设将清空当前工作区，确定继续吗？")) return; }
            moduleContainer.innerHTML = '';
            moduleContainer.style.minHeight = '100%';
            const cardXaml = `&lt;local:MyCard Title=&quot;%%TEXT%%&quot; Margin=&quot;0,0,0,15&quot; CanSwap=&quot;True&quot; IsSwapped=&quot;False&quot;&gt;&#xA;    &lt;StackPanel Margin=&quot;25,40,23,15&quot;&gt;&#xA;%%CONTENT%%&#xA;    &lt;/StackPanel&gt;&#xA;&lt;/local:MyCard&gt;`;
            const card = createPlacedModule('MyCard', cardXaml, '欢迎来到 PCL2');
            card.style.left = '40px'; card.style.top = '40px';
            moduleContainer.appendChild(card); card.dataset.order = 0;
            const dz = card.querySelector('.container-dropzone');
            const textXaml = `&lt;TextBlock TextWrapping=&quot;Wrap&quot; Margin=&quot;0,0,0,4&quot; Text=&quot;%%TEXT%%&quot; /&gt;`;
            const text = createPlacedModule('TextBlock', textXaml, '这是一个使用模块化编辑器生成的预设主页。');
            text.style.position = 'relative'; dz.appendChild(text); text.dataset.order = 0;
            const btnXaml = `&lt;local:MyButton Height=&quot;35&quot; HorizontalAlignment=&quot;Left&quot; Padding=&quot;20,0,20,0&quot; Text=&quot;%%TEXT%%&quot; EventType=&quot;打开网页&quot; EventData=&quot;https://www.bilibili.com/&quot; ToolTip=&quot;把鼠标停在这里别动…… 就能看到这句话！&quot; /&gt;`;
            const btn = createPlacedModule('MyButton', btnXaml, '把鼠标停在这里别动……');
            btn.style.position = 'relative'; dz.appendChild(btn); btn.dataset.order = 1;
            const dlgXaml = `&lt;local:MyButton Height=&quot;35&quot; HorizontalAlignment=&quot;Left&quot; Padding=&quot;20,0,20,0&quot; Text=&quot;%%TEXT%%&quot; EventType=&quot;弹出窗口&quot; /&gt;`;
            const dlg = createPlacedModule('MyButton', dlgXaml, '显示一个弹窗');
            dlg.style.position = 'relative'; dz.appendChild(dlg); dlg.dataset.order = 2;
            dlg.dataset.eventType = '弹出窗口';
            dlg.dataset.windowTitle = '这是标题';
            dlg.dataset.windowContent = '标题与内容以竖线间隔。\\n你也可以直接在其中换行。';
            dlg.dataset.windowButtonText = '确定';
            dlg.dataset.windowButtonEventType = '';
            dlg.dataset.windowButtonEventData = '';
            dlg.dataset.eventData = '这是标题|标题与内容以竖线间隔。\\n你也可以直接在其中换行。';
            const dlgTag = dlg.querySelector('.event-info-tag');
            if (dlgTag) dlgTag.innerText = '弹窗: 这是标题';

            const listXaml = `&lt;local:MyListItem Margin=&quot;-5,2,-5,8&quot; Logo=&quot;https://www.baidu.com/favicon.ico&quot; Title=&quot;%%TEXT%%&quot; Info=&quot;百度一下，你就知道&quot; Type=&quot;Clickable&quot; EventType=&quot;打开网页&quot; EventData=&quot;https://www.baidu.com/&quot; /&gt;`;
            const li = createPlacedModule('MyListItem', listXaml, '百度');
            li.style.left = '40px'; li.style.top = '380px';
            moduleContainer.appendChild(li); li.dataset.order = 1;
            const nt = createPlacedModule('Note', '点击编辑备注', '点击编辑备注');
            nt.style.left = '400px'; nt.style.top = '380px';
            moduleContainer.appendChild(nt); nt.dataset.order = 2;
            setTimeout(redrawConnections, 50);
        });

        document.getElementById('btn-preview').addEventListener('click', () => {
            sourceTextarea.value = generateFullXaml() || "暂无模块内容。";
            sourcePreview.style.display = sourcePreview.style.display === 'flex' ? 'none' : 'flex';
        });

        document.getElementById('btn-export').addEventListener('click', () => {
            const x = generateFullXaml();
            if (!x) { alert("修改区为空，请先拖拽模块！"); return; }
            const blob = new Blob([x], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'Custom.xaml';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        workspace.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
        workspace.addEventListener('drop', (e) => {
            e.preventDefault();
            if (isPreviewMode()) return;
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const content = ev.target.result;
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(content, "text/xml");
                    if (xmlDoc.getElementsByTagName("parsererror").length > 0) { fallbackImportFile(content, file.name, e); return; }
                    const rootNodes = xmlDoc.documentElement.children;
                    let n = 0;
                    for (let i = 0; i < rootNodes.length; i++) {
                        const node = rootNodes[i];
                        const tagName = node.tagName;
                        if (tagName.startsWith('local:My') || tagName === 'TextBlock' || tagName === 'StackPanel') {
                            const title = node.getAttribute('Title') || node.getAttribute('Text') || '导入模块';
                            const evT = node.getAttribute('EventType') || '';
                            const evD = node.getAttribute('EventData') || '';
                            const src = node.getAttribute('Source') || '';
                            const tip = node.getAttribute('ToolTip') || '';
                            const iBg = node.getAttribute('Background') || DEFAULT_BG;
                            const iFg = node.getAttribute('Foreground') || DEFAULT_FG;
                            let tpl = `<${tagName}`;
                            for (let attr of node.attributes) {
                                if (attr.name === 'Background' || attr.name === 'Foreground') continue;
                                if (attr.name === 'Title' || attr.name === 'Text') tpl += ` ${attr.name}="%%TEXT%%"`;
                                else if (attr.name === 'Source') tpl += ` Source="%%SOURCE%%"`;
                                else tpl += ` ${attr.name}="${escapeXaml(attr.value)}"`;
                            }
                            if (tagName === 'local:MyCard' || tagName === 'StackPanel') tpl += `>\n%%CONTENT%%\n</${tagName}>`;
                            else tpl += ` />`;
                            const nm = createPlacedModule(tagName, tpl, title, src);
                            if (evT) nm.dataset.eventType = evT;
                            if (evD) nm.dataset.eventData = evD;
                            if (tip) nm.dataset.tooltip = tip;
                            if (evT === '弹出窗口' && evD) {
                                const parts = evD.split('|');
                                nm.dataset.windowTitle = parts[0] || '提示';
                                nm.dataset.windowContent = parts.slice(1).join('|') || '';
                                nm.dataset.windowButtonText = '确定';
                                const tag = nm.querySelector('.event-info-tag');
                                if (tag) tag.innerText = `弹窗: ${nm.dataset.windowTitle}`;
                            }
                            nm.dataset.bgColor = iBg; nm.dataset.textColor = iFg;
                            applyModuleColors(nm);
                            nm.style.left = (40 + n * 40) + 'px'; nm.style.top = (40 + n * 40) + 'px';
                            moduleContainer.appendChild(nm);
                            nm.dataset.order = n;
                            n++;
                        }
                    }
                    if (n === 0) fallbackImportFile(content, file.name, e);
                    setTimeout(redrawConnections, 50);
                };
                reader.readAsText(file);
            }
        });

        function fallbackImportFile(content, fileName, e) {
            const wR = moduleContainer.getBoundingClientRect();
            const nm = createPlacedModule('TextBlock', content, '导入文件: ' + fileName);
            nm.style.left = (e.clientX - wR.left - 100) + 'px';
            nm.style.top = (e.clientY - wR.top - 25) + 'px';
            moduleContainer.appendChild(nm);
            assignNewOrder(nm, moduleContainer);
        }

        window.addEventListener('resize', () => {
            if (!isPreviewMode()) {
                redrawConnections();
                document.querySelectorAll('.placed-module').forEach(m => updateAttachedNotes(m));
            }
        });
        window.addEventListener('orientationchange', () => setTimeout(redrawConnections, 200));
        setTimeout(redrawConnections, 200);
    </script>
</body>
